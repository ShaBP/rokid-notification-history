plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shabp.rokid.notificationhistory'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += 'META-INF/versions/**'
        }
    }

    defaultConfig {
        applicationId 'com.shabp.rokid.notificationhistory'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.10.2'
    }

    def notificationStore = System.getenv('NOTIFICATION_KEYSTORE_FILE')
    def hasNotificationSigning = notificationStore &&
        System.getenv('NOTIFICATION_KEYSTORE_PASSWORD') &&
        System.getenv('NOTIFICATION_KEY_ALIAS') &&
        System.getenv('NOTIFICATION_KEY_PASSWORD')

    signingConfigs {
        if (hasNotificationSigning) {
            release {
                storeFile file(notificationStore)
                storePassword System.getenv('NOTIFICATION_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NOTIFICATION_KEY_ALIAS')
                keyPassword System.getenv('NOTIFICATION_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasNotificationSigning) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}
