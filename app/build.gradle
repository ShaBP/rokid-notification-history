plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shabp.rokid.notificationhistory'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += 'META-INF/versions/**'
        }
    }

    defaultConfig {
        applicationId 'com.shabp.rokid.notificationhistory'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.10.0-diagnostic'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}
