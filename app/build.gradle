plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shabp.rokid.notificationhistory'
    compileSdk 36

    defaultConfig {
        applicationId 'com.shabp.rokid.notificationhistory'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.9.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.flyfishxu:kadb:2.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}
