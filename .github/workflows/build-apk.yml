name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent encrypted signing key
        env:
          NOTIFICATION_SIGNING_BACKUP_PASSWORD: ${{ secrets.NOTIFICATION_SIGNING_BACKUP_PASSWORD }}
        run: |
          test -n "$NOTIFICATION_SIGNING_BACKUP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/notification-signing"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/notification-history-signing-backup.tar.gz.enc \
            -out "$RUNNER_TEMP/notification-signing.tar.gz" \
            -pass env:NOTIFICATION_SIGNING_BACKUP_PASSWORD
          tar -xzf "$RUNNER_TEMP/notification-signing.tar.gz" -C "$RUNNER_TEMP/notification-signing"
          set -a
          . "$RUNNER_TEMP/notification-signing/credentials.txt"
          set +a
          echo "NOTIFICATION_KEYSTORE_FILE=$RUNNER_TEMP/notification-signing/notification-history-release.jks" >> "$GITHUB_ENV"
          echo "NOTIFICATION_KEYSTORE_PASSWORD=$NOTIFICATION_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOTIFICATION_KEY_ALIAS=$NOTIFICATION_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOTIFICATION_KEY_PASSWORD=$NOTIFICATION_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build and verify signed release APK
        run: |
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notification-History-v1.10.2-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish v1.10.2 release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Release Notification History v1.10.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Notification-History-v1.10.2.apk
          gh release create v1.10.2 Notification-History-v1.10.2.apk \
            --target "$GITHUB_SHA" \
            --title "Notification History v1.10.2" \
            --notes "Production release with display-safe Accessibility watchdog recovery and permanent release signing. This is the first APK using the permanent Notification History signing certificate, so users of earlier builds must uninstall once before installing v1.10.2. Future signed updates will install normally."
